project:
  type: website
  execute-dir: project
  render: 
    - "*.qmd"
    - "!docs/*"
  resources: 
    - "assets/**"
    - "!assets/resources/**"
    - "inst/**"
    - "theme/**"

website:
  title: "ALONGate"
  site-url: https://zzzhehao.github.io/ALONGate_Project
  site-path: ./
  description: "ALONGate Project: WCMB 2026"
  draft-mode: unlinked
  # google-analytics: "G-V4PGH0S5Q5"
  # cookie-consent: true

  navbar: 
    # logo: "assets/logo/MSM145_transparent.png"
    left: 
      - text: "Our WCMB Talk"
        href: chapter/research/kohlenbach-talk.qmd
      - text: "Our WCMB Poster"
        href: chapter/research/wcmb-poster.qmd
      - text: "Project"
        menu:
          - text: "About"
            href: chapter/project/about.qmd
          - text: "Team"
            href: chapter/project/team.qmd
          - text: "Expeditions"
            href: chapter/project/expeditions.qmd
      - text: "Research"
        menu: 
          - text: "Benthic Lander Observatory System"
            href: chapter/research/blos.qmd
          - text: "Benthic Survey"
            href: chapter/research/benthic-survey.qmd
          - text: "Cumaceans in the Deep Arctic Ocean"
            href: chapter/research/arctic-cumacean.qmd
          - text: "New and Old Isopods"
            href: chapter/research/new-old-isopods.qmd
          - text: "Integrative Taxonomy of Sea Spiders"
            href: chapter/research/pycno.qmd
      - text: "Impact"
        menu:
          - text: "Workshops"
            href: chapter/impact/workshops.qmd
          - text: "Collaborations"
            href: chapter/impact/collaborations.qmd
    search: true
    background: transparent

format:
  html:
    include-in-header: theme/favicon.html
    highlight-style: atom-one-dark
    theme: 
      light: [theme/light.scss]
      dark: [theme/dark.scss]
    toc: true


lightbox: true
execute:
  freeze: auto
  echo: false